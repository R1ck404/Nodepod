name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter nodepod...

      - name: Type check
        run: pnpm run type-check

      - name: Build
        run: pnpm run build:publish

      - name: Test
        # Worker limits live in vitest.config.ts (maxWorkers: 2). Do not pass
        # flags after `--` — Vitest treats those as name filters, not options.
        run: pnpm test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser preview regression
        run: pnpm run test:browser:preview

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build documentation
        run: pnpm run docs:check

      - name: Install Chromium
        run: pnpm --filter nodepod-site exec playwright install --with-deps chromium

      - name: Test production documentation preview
        run: pnpm --filter nodepod-site test

      - name: Upload documentation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nodepod-docs-playwright-report
          path: website/playwright-report
          if-no-files-found: ignore
          retention-days: 14
