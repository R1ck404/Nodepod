<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Nodepod preview downloads harness</title>
  </head>
  <body>
    <p id="status">booting</p>
    <a id="host-download" href="/tests/browser/host-file.txt" download="host-file.txt">host download</a>
    <iframe id="preview" style="width: 600px; height: 300px"></iframe>
    <script type="module">
      // Boots a pod serving a page with an `<a download>` and a programmatic
      // anchor click, in either preview mode (`?mode=virtual` for the
      // /__virtual__/ path mode, hostname mode otherwise). The spec checks
      // that downloads carry the pod response and that `fetch()` responses
      // landing on the SPA fallback are not decorated with the preview shims.
      import { Nodepod } from "/dist/index.mjs";

      const status = document.querySelector("#status");
      const preview = document.querySelector("#preview");
      const virtualMode = new URLSearchParams(location.search).get("mode") === "virtual";

      const pod = await Nodepod.boot({
        swUrl: "/__sw__.js",
        watermark: false,
        previewOrigin: virtualMode ? false : undefined,
        workdir: "/workspace",
        files: {
          "/workspace/server.mjs": `
            import http from "node:http";
            http.createServer((req, res) => {
              if (req.url === "/api/export") {
                res.setHeader("content-type", "text/csv");
                res.end(["a,b", "1,2", ""].join(String.fromCharCode(10)));
                return;
              }
              res.setHeader("content-type", "text/html");
              res.end(
                '<!doctype html><html><head><title>preview</title></head><body><h1>index</h1>' +
                '<a id="dl" href="/api/export" download="export.csv">dl</a>' +
                '<button id="prog">prog</button>' +
                '<script>document.getElementById("prog").onclick = function () { var a = document.createElement("a"); a.href = "/api/export"; a.download = "prog.csv"; a.click(); };<\\/script>' +
                '</body></html>',
              );
            }).listen(3000);
          `,
        },
        onServerReady(port, url) {
          if (port !== 3000) return;
          status.textContent = url;
          status.dataset.ready = "true";
          preview.src = url;
        },
      });
      window.pod = pod;
      await pod.spawn("node", ["server.mjs"], { cwd: "/workspace" });
    </script>
  </body>
</html>
