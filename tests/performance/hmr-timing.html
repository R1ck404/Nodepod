<!doctype html>
<meta charset="utf-8">
<title>Native preview HMR timing</title>
<pre id="status">starting</pre><iframe id="preview" style="width:600px;height:200px"></iframe>
<pre id="results"></pre>
<script type="module">
import { Nodepod } from '/dist/index.mjs';
const frame = document.getElementById('preview');
const status = document.getElementById('status');
// Call the native getter: browser hosts may shadow document.visibilityState.
function visibility(doc) {
  return Object.getOwnPropertyDescriptor(doc.defaultView.Document.prototype,'visibilityState').get.call(doc);
}
function timer(win, delay) {
  const start = performance.now();
  return new Promise(resolve => win.setTimeout(() => resolve(performance.now()-start),delay));
}
let waiter;
addEventListener('message',event => {
  if(event.source===frame.contentWindow && event.data?.marker===waiter?.marker) {
    const current=waiter; waiter=null; current.resolve(event.data);
  }
});
function rendered(marker) {
  return new Promise((resolve,reject) => {
    const timeout=setTimeout(()=>reject(new Error('render timeout '+marker)),15000);
    waiter={marker,resolve:value=>{clearTimeout(timeout);resolve(value)}};
  });
}
function app(marker) {
  return `import {useState,useEffect} from 'react';
export default function App(){
const [count,setCount]=useState(0);
useEffect(()=>parent.postMessage({marker:'${marker}',count},'*'));
return <main><h1>${marker}</h1><button id="counter" onClick={()=>setCount(v=>v+1)}>{count}</button></main>;
}`;
}
let pod,dev;
try {
  let ready;
  const server=new Promise(resolve=>ready=resolve);
  pod=await Nodepod.boot({workdir:'/app',watermark:false,onServerReady:(_port,url)=>ready(url),files:{
    '/app/package.json':JSON.stringify({name:'hmr-timing-fixture',private:true,type:'module',dependencies:{
      react:'19.1.0','react-dom':'19.1.0',vite:'8.0.10','@vitejs/plugin-react':'5.0.4'}}),
    '/app/vite.config.js':`import react from '@vitejs/plugin-react';export default {plugins:[react()],server:{host:'0.0.0.0',port:5173,strictPort:true}};`,
    '/app/index.html':'<div id="root"></div><script type="module" src="/src/main.jsx"><\/script>',
    '/app/src/main.jsx':`import {createRoot} from 'react-dom/client';import App from './App.jsx';createRoot(document.getElementById('root')).render(<App/>);`,
    '/app/src/App.jsx':app('MARKER_0'),
  }});
  const install=await pod.spawn('npm',['install'],{cwd:'/app'});
  if((await install.completion).exitCode!==0)throw new Error('install failed');
  dev=await pod.spawn('npx',['vite'],{cwd:'/app'});
  const initial=rendered('MARKER_0');frame.src=await server;await initial;
  window.runHmrTiming=async()=>{
    const result={reportedHostVisibility:document.visibilityState,nativeHostVisibility:visibility(document),
      nativePreviewVisibility:visibility(frame.contentDocument),timerMs:await timer(frame.contentWindow,16),updates:[]};
    for(let i=1;i<=5;i++) {
      const done=rendered('MARKER_'+i),start=performance.now();
      await pod.fs.writeFile('/app/src/App.jsx',app('MARKER_'+i));
      const render=await done;
      result.updates.push({ms:performance.now()-start,count:render.count});
    }
    document.getElementById('results').textContent=JSON.stringify(result,null,2);
    return result;
  };
  window.stopHmrTiming=async()=>{frame.src='about:blank';dev.kill();await pod.teardown()};
  status.textContent='READY';
}catch(error){status.textContent='FAIL '+error.stack}
</script>
