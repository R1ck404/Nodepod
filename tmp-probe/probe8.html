<!doctype html>
<html><head><meta charset="UTF-8"><title>probe8</title></head>
<body>
<p id="status">booting</p>
<iframe id="preview" style="width:400px;height:200px"></iframe>
<iframe id="hostframe" style="width:400px;height:200px"></iframe>
<script type="module">
  import { Nodepod } from "/dist/index.mjs";
  const status = document.querySelector("#status");
  const preview = document.querySelector("#preview");
  const params = new URLSearchParams(location.search);
  const reserve = params.get("reserve") === "1";
  const files = {
    "/workspace/server.mjs": `
      import http from "node:http";
      http.createServer((req, res) => {
        res.setHeader("content-type", "text/html");
        res.end('<!doctype html><html><head><title>t</title></head><body><h1>pod app</h1></body></html>');
      }).listen(3000);
    `,
  };
  async function bootPod() {
    let readyUrl = null;
    const pod = await Nodepod.boot({
      swUrl: "/__sw__.js",
      watermark: false,
      previewOrigin: false,
      workdir: "/workspace",
      files,
      reservedHostPaths: reserve ? ["/tmp-probe/host-frame.html", "/tmp-probe/"] : undefined,
      onServerReady(port, url) { if (port === 3000) readyUrl = url; },
    });
    await pod.spawn("node", ["server.mjs"], { cwd: "/workspace" });
    while (!readyUrl) await new Promise(r => setTimeout(r, 50));
    return { pod, url: readyUrl };
  }
  const first = await bootPod();
  window.first = first;
  preview.src = first.url;
  status.textContent = first.url;
  status.dataset.ready = "true";
  window.disposeFirst = async () => { first.pod.teardown(); };
  window.bootSecond = async () => { const s = await bootPod(); window.second = s; return s.url; };
</script>
</body></html>
