<!doctype html>
<html><head><meta charset="UTF-8"><title>probe7</title></head>
<body>
<p id="status">booting</p>
<a id="hostdl" href="/tmp-probe/host.txt" download="host.txt">host download</a>
<iframe id="preview" style="width:600px;height:300px"></iframe>
<script type="module">
  import { Nodepod } from "/dist/index.mjs";
  const status = document.querySelector("#status");
  const preview = document.querySelector("#preview");
  const pod = await Nodepod.boot({
    swUrl: "/__sw__.js",
    watermark: false, previewOrigin: false,
    workdir: "/workspace",
    files: {
      "/workspace/server.mjs": `
        import http from "node:http";
        http.createServer((req, res) => {
          if (req.url === "/api/export") {
            res.setHeader("content-type", "text/csv");
            res.end(["a,b","1,2",""].join(String.fromCharCode(10)));
            return;
          }
          res.setHeader("content-type", "text/html");
          res.end('<!doctype html><html><head><title>t</title></head><body><h1>index</h1>' +
            '<a id="dl" href="/api/export" download="export.csv">dl</a>' +
            '<button id="prog">prog</button>' +
            '<script>document.getElementById("prog").onclick = function(){ var a = document.createElement("a"); a.href = "/api/export"; a.download = "prog.csv"; a.click(); };<\/script>' +
            '</body></html>');
        }).listen(3000);
      `,
    },
    onServerReady(port, url) {
      if (port !== 3000) return;
      status.textContent = url;
      status.dataset.ready = "true";
      preview.src = url;
    },
  });
  window.pod = pod;
  await pod.spawn("node", ["server.mjs"], { cwd: "/workspace" });
</script>
</body></html>
