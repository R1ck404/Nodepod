<!doctype html>
<html><head><meta charset="UTF-8"><title>probe9</title></head>
<body>
<pre id="log"></pre>
<script type="module">
  import { Nodepod } from "/dist/index.mjs";
  const log = (...a) => { document.querySelector("#log").textContent += a.join(" ") + "\n"; };
  window.__results = {};
  const pod = await Nodepod.boot({ swUrl: "/__sw__.js", watermark: false, workdir: "/workspace", files: {} });
  const cases = {
    immediate: "const v = await new Promise((resolve) => setImmediate(() => resolve('imm'))); console.log('got', v);",
    mc_close: "const v = await new Promise((resolve) => { const mc = new MessageChannel(); mc.port1.onmessage = (ev) => { resolve(ev.data); mc.port1.close(); }; mc.port2.postMessage('x'); }); console.log('got', v);",
    mc_noclose: "const v = await new Promise((resolve) => { const mc = new MessageChannel(); mc.port1.onmessage = (ev) => { resolve(ev.data); }; mc.port2.postMessage('x'); }); console.log('got', v);",
    nexttick: "const v = await new Promise((resolve) => process.nextTick(() => resolve('tick'))); console.log('got', v);",
    timeout_then_immediate: "await new Promise(r => setTimeout(r, 5)); const v = await new Promise((resolve) => setImmediate(() => resolve('imm2'))); console.log('got', v);",
  };
  for (const [name, code] of Object.entries(cases)) {
    const proc = await pod.spawn("node", ["-e", code], { cwd: "/workspace" });
    let out = "";
    proc.on("output", c => { out += c; });
    const result = await Promise.race([
      proc.completion.then(r => ({ ...r, timedOut: false })),
      new Promise(r => setTimeout(() => r({ timedOut: true, stdout: out }), 3000)),
    ]);
    if (result.timedOut) proc.kill();
    window.__results[name] = result;
    log(name, JSON.stringify(result));
  }
  window.__done = true;
</script>
</body></html>
